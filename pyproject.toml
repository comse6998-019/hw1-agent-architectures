[project]
name = "triage-agent"
version = "0.1.0"
description = "COMS E6998-019 HW1 starter: a bounded, sequential security-alert triage agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.4",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
]

[project.scripts]
triage = "triage.interfaces.cli:main"

[project.optional-dependencies]
live = [
    "langchain>=1.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
scan = [
    "bandit==1.9.4",
    "semgrep==1.176.0",
]
